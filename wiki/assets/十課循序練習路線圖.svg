<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">吉他初學十課循序練習路線圖</title>
  <desc id="desc">十課由認識吉他、調弦、撥弦、開放和弦、和弦轉換、節奏、大橫按、讀譜、歌曲整合，最後到成果演奏。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#2c1e16}.small{font-size:20px;fill:#725d4d}.path{fill:none;stroke:#d9a367;stroke-width:5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="680" rx="28" fill="#faf7f2"/>
  <text x="60" y="70" font-size="36" font-weight="800">十課循序練習路線</text>
  <text x="60" y="108" class="small">由樂器認識開始，逐步整合成演奏</text>
  <path d="M175 240H1030V470H175" class="path"/>
  <g text-anchor="middle">
    <g><circle cx="175" cy="240" r="42" fill="#d97706"/><text x="175" y="251" fill="#fff" font-size="30" font-weight="800">1</text><text x="175" y="315" font-size="20">認識吉他</text></g>
    <g><circle cx="388" cy="240" r="42" fill="#c78243"/><text x="388" y="251" fill="#fff" font-size="30" font-weight="800">2</text><text x="388" y="315" font-size="20">定弦手型</text></g>
    <g><circle cx="600" cy="240" r="42" fill="#b87541"/><text x="600" y="251" fill="#fff" font-size="30" font-weight="800">3</text><text x="600" y="315" font-size="20">單音撥弦</text></g>
    <g><circle cx="813" cy="240" r="42" fill="#a96b40"/><text x="813" y="251" fill="#fff" font-size="30" font-weight="800">4</text><text x="813" y="315" font-size="20">開放和弦</text></g>
    <g><circle cx="1025" cy="240" r="42" fill="#95603e"/><text x="1025" y="251" fill="#fff" font-size="30" font-weight="800">5</text><text x="1025" y="315" font-size="20">和弦轉換</text></g>
    <g><circle cx="1025" cy="470" r="42" fill="#95603e"/><text x="1025" y="481" fill="#fff" font-size="30" font-weight="800">6</text><text x="1025" y="545" font-size="20">節奏練習</text></g>
    <g><circle cx="813" cy="470" r="42" fill="#a96b40"/><text x="813" y="481" fill="#fff" font-size="30" font-weight="800">7</text><text x="813" y="545" font-size="20">大橫按</text></g>
    <g><circle cx="600" cy="470" r="42" fill="#b87541"/><text x="600" y="481" fill="#fff" font-size="30" font-weight="800">8</text><text x="600" y="545" font-size="20">簡譜與 TAB</text></g>
    <g><circle cx="388" cy="470" r="42" fill="#c78243"/><text x="388" y="481" fill="#fff" font-size="30" font-weight="800">9</text><text x="388" y="545" font-size="20">歌曲整合</text></g>
    <g><circle cx="175" cy="470" r="42" fill="#d97706"/><text x="175" y="481" fill="#fff" font-size="27" font-weight="800">10</text><text x="175" y="545" font-size="20">成果演奏</text></g>
  </g>
  <text x="600" y="630" text-anchor="middle" class="small">每一課先求穩定，再逐步增加難度</text>
</svg>
