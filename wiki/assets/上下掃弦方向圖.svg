<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">吉他上下掃弦方向圖</title>
  <desc id="desc">六條琴弦搭配下掃與上掃箭頭，提醒保持手腕放鬆並穩定掃過琴弦。</desc>
  <defs>
    <marker id="down" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d97706"/></marker>
    <marker id="up" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#9a6a47"/></marker>
    <style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#2c1e16}.muted{font-size:22px;fill:#725d4d}</style>
  </defs>
  <rect width="1000" height="540" rx="28" fill="#faf7f2"/>
  <text x="55" y="68" font-size="36" font-weight="800">掃弦方向與手腕動作</text>
  <text x="55" y="105" class="muted">先慢慢掃過琴弦，維持放鬆與穩定</text>
  <g stroke="#9b7557" stroke-linecap="round">
    <path d="M130 180H870" stroke-width="7"/><path d="M130 220H870" stroke-width="6"/><path d="M130 260H870" stroke-width="5"/>
    <path d="M130 300H870" stroke-width="4"/><path d="M130 340H870" stroke-width="3"/><path d="M130 380H870" stroke-width="2"/>
  </g>
  <path d="M330 145L520 415" fill="none" stroke="#d97706" stroke-width="13" stroke-linecap="round" marker-end="url(#down)"/>
  <path d="M690 415L800 145" fill="none" stroke="#9a6a47" stroke-width="13" stroke-linecap="round" marker-end="url(#up)"/>
  <rect x="250" y="435" width="230" height="58" rx="18" fill="#f4d7a8"/><text x="365" y="474" text-anchor="middle" font-size="27" font-weight="700">下掃・放鬆手腕</text>
  <rect x="580" y="435" width="230" height="58" rx="18" fill="#eadfcf"/><text x="695" y="474" text-anchor="middle" font-size="27" font-weight="700">上掃・動作輕柔</text>
</svg>
